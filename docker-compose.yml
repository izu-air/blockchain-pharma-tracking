services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharma_chain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pharma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharma_chain"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pharma_chain
      DB_USER: postgres
      DB_PASSWORD: postgres
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: change-in-production-use-long-secret
      REQUIRE_JWT_FOR_WRITES: "true"
      FLYWAY_ENABLED: "true"
      BLOCKCHAIN_INDEXER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pharma_pg_data:
