# PharmaChain Trace — production nginx config (in front of dist/)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # -- Security headers ----------------------------------------------------
    add_header X-Frame-Options          "DENY"            always;
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header Referrer-Policy          "no-referrer"     always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    # Allow MetaMask / wallet popup (which uses extension-protocol origin).
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080 ws: wss: https:; frame-ancestors 'none';" always;

    # -- Healthcheck for docker / k8s ---------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # -- Long-lived cache for hashed assets, no-cache for entry HTML ---------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # -- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
