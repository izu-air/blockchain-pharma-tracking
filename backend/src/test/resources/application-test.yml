app:
  jwt:
    secret: integration-test-secret-with-at-least-32-chars-aaaa
  security:
    require-authentication-for-mutations: false

spring:
  datasource:
    url: jdbc:h2:mem:pharma_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    # Migrations are PostgreSQL-specific (TIMESTAMPTZ, regex CHECKs); the
    # integration tests run against H2, so Hibernate manages the test
    # schema via ddl-auto: create-drop and Flyway stays disabled.
    enabled: false


blockchain:
  indexer:
    enabled: false
