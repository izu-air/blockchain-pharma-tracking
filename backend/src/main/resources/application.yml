spring:
  application:
    name: pharma-supply-chain
  datasource:
    # Local-dev defaults match docs/local-setup.md (postgres/postgres).
    # Production deployments inject DB_URL / DB_USER / DB_PASSWORD via env;
    # docker-compose makes POSTGRES_PASSWORD a required ${...:?error} value.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pharma_chain}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:332018}
    hikari:
      # Быстрее явный таймаут вместо долгого «висения», если PostgreSQL недоступен
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    # Явный диалект: при недоступной БД Hibernate всё равно не создаст полноценный JdbcEnvironment,
    # но сообщение чаще указывает на реальную причину (connection refused / auth), а не только на dialect.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Default "validate" — Flyway owns schema evolution (V*__*.sql under
      # src/main/resources/db/migration).  For ad-hoc local dev without
      # Flyway, override HIBERNATE_DDL_AUTO=update or set FLYWAY_ENABLED=false.
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Expose only liveness/readiness — never expose env/heapdump/etc in prod.
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

blockchain:
  rpc-url: ${BLOCKCHAIN_RPC_URL:}
  contract-address: ${BLOCKCHAIN_CONTRACT_ADDRESS:}
  indexer:
    enabled: ${BLOCKCHAIN_INDEXER_ENABLED:false}
    delay-ms: ${BLOCKCHAIN_INDEXER_DELAY_MS:30000}
    chunk-size: ${BLOCKCHAIN_INDEXER_CHUNK:2000}

app:
  admin:
    # Wallet (lower-case 0x-prefixed) that is auto-created as ADMIN at startup.
    # Empty by default — set APP_ADMIN_WALLET in production to enable the
    # bootstrap.  The wallet still needs to perform a SIWE login to receive
    # a JWT; this just guarantees there is at least one ADMIN row in the DB.
    wallet: ${APP_ADMIN_WALLET:}
    name:   ${APP_ADMIN_NAME:System administrator}
  jwt:
    # MUST be supplied via environment (JWT_SECRET).  The application fails
    # to start otherwise — no plaintext default is provided on purpose so
    # that a misconfigured deployment cannot accidentally accept forged
    # tokens signed with a well-known string.
    secret: ${JWT_SECRET:}
  security:
    require-authentication-for-mutations: ${REQUIRE_JWT_FOR_WRITES:true}
