name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Smart contract: Hardhat compile + 10 mocha tests
  # ------------------------------------------------------------------
  contracts:
    name: Contracts (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx hardhat compile --quiet
      - run: npm test

  # ------------------------------------------------------------------
  # Backend: Spring Boot unit + integration tests (H2 in-memory)
  # ------------------------------------------------------------------
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B -ntp -DskipITs test
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports
          retention-days: 7

  # ------------------------------------------------------------------
  # Frontend: type-check, build, vitest
  # ------------------------------------------------------------------
  frontend:
    name: Frontend (Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check + production build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test -- --run

  # ------------------------------------------------------------------
  # Docker images can be built (no push) — catches Dockerfile drift
  # ------------------------------------------------------------------
  docker-build:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [contracts, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: pharma-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: pharma-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080/api
